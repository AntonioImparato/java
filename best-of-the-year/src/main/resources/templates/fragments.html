<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<th:block th:fragment="head">
			<title  th:text="${title}"></title>
			<!-- Bootstrap CSS -->
			<link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
		</th:block>
	</head>
	

	
	<body>
		<header>
			<nav th:fragment="navbar(route)" class="navbar navbar-expand-lg bg-body-tertiary">
				  <div class="container-fluid">
				   <h1 class="fs-2 " th:text="${title}" ></h1> 
				    <div class="collapse navbar-collapse" id="navbarSupportedContent">
				      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
				        <li class="nav-item">
				          <a class="nav-link " aria-current="page" th:href="@{/home}" th:classappend="${route =='home' ? 'active' : 'non-active'}">Home</a>
				        </li>
				        <li class="nav-item">
				          <a class="nav-link" th:href="@{/movies}" th:classappend="${route =='movies' ? 'active' : 'non-active'}" >movies</a>
				        </li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/songs}" th:classappend="${route =='songs' ? 'active' : 'non-active'}" >song</a>
					    </li>
				      </ul>
				    </div>
				  </div>
				</nav>
			</header>
			
			<footer th:fragment="scripts">
				
			</footer>
	</body>
</html>
