<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
	<head th:replace="fragments :: head" >
	</head>
	<body >
		
			<header th:insert="fragments :: navbar('songs')">
			</header>
	
			<ul class="list-group">
			  <li class="list-group-item" th:each="song : ${songsList}">
				[[ ${song.title} ]]
			  </li>
			</ul>
			
	</body>
</html>
