<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="fragments/fragments :: head">
	<title>Lista Pizze</title>
</head>

<body>
	<header th:insert="fragments/navbar :: navbar('pizze')"></header>

	<main class="container">
		<div class="row">
			<div class="col-12">
				<h1 class="mb-4">Le Nostre Pizze</h1>
				<div class="row justify-content-center">
					<div th:if="${pizze.isEmpty()}">
						<p class="alert alert-warning">Non ci sono pizze al momento.</p>
						<div class=" mb-3 text-center">

							<a th:href="@{/pizze/create}" class="btn btn-lg btn-primary">
								aggiungi pizza
							</a>
						</div>
					</div>
					<div class="row" th:unless="${pizze.isEmpty()}">

						<!-- success -->
						<th:block th:if="${successMessage != null }">
							<div th:replace="fragments/fragments :: successAlert(${ successMessage })">	</div>
						</th:block>
						
						<!-- delete -->
						<th:block th:if="${deleteMessage != null }">
							<div th:replace="fragments/fragments :: deleteAlert(${ deleteMessage })">	</div>
						</th:block>
						
						<th:block th:replace="fragments/fragments :: form"></th:block>

						<div class="col-md-4" th:each="pizza : ${pizze}">
							<div class="card mb-4">
								<img th:src="${pizza.urlFoto}" class="card-img-top" alt="Foto di ${pizza.nome}">
								<div class="card-body">
									<h5 class="card-title" th:text="${pizza.nome}"></h5>
									<!-- <p class="card-text" th:text="${pizza.descrizione}"></p> -->
									<p class="card-text"><strong th:text="${pizza.prezzo} + ' €'"></strong></p>
									<div>
										<a th:href="@{/pizze/show/{id}(id=${pizza.id})}" class="btn btn-sm btn-primary">
											show
										</a>
										<a th:href="@{/pizze/edit/{id}(id=${pizza.id})}" class="btn btn-sm btn-warning">
											edit
										</a>

										<!-- Button trigger modal -->
										<button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal"
											th:data-bs-target="'#delete-modal-' + ${pizza.id}">
											Delete
										</button>

										<!-- Modal -->
										<div class="modal fade" th:id="'delete-modal-' + ${pizza.id}" tabindex="-1"
											aria-labelledby="delete-modal" aria-hidden="true">
											<div class="modal-dialog modal-dialog-centered">
												<div class="modal-content">
													<div class="modal-header">
														<h1 class="modal-title fs-5" id="exampleModalLabel"> Stai per
															eliminare <strong> "[[ ${ pizza.nome } ]]" </strong>
														</h1>
														<button type="button" class="btn-close" data-bs-dismiss="modal"
															aria-label="Close"></button>
													</div>
													<div class="modal-body">
														Sicuro di voler procedere con la cancellazione ?
													</div>
													<div class="modal-footer">
														<button type="button" class="btn btn-sm btn-secondary"
															data-bs-dismiss="modal">Close</button>
														<form class="d-inline-block"
															th:action="@{pizze/delete/{id}(id=${pizza.id})}"
															method="POST">
															<button type="submit" class="btn btn-sm btn-danger">
																delete
															</button>
														</form>
													</div>
												</div>
											</div>
										</div>

									</div>
								</div>
							</div>
						</div>

						<div class=" mb-3 text-center">

							<a th:href="@{/pizze/create}" class="btn btn-lg btn-primary">
								aggiungi pizza
							</a>
						</div>

					</div>
				</div>
			</div>
	</main>
	<footer th:insert="fragments/fragments :: footer"></footer>
</body>

</html>
